<style>
  :root{
    --ground-1:#f4f3f0;
    --ground-2:#dcdedd;
    --ground-3:#c4cacd;
    --vein-rgb:118,130,140;
    --cloud-rgb:142,152,159;
    --vein-a:.26;
    --cloud-a:.14;

    --navy:#2f4557;
    --navy-soft:#4a6373;
    --ink:#1b2a35;
    --muted:#5f6e78;

    --logo-slab:rgba(255,255,255,.52);

    --panel:rgba(255,255,255,.62);
    --panel-line:rgba(41,63,79,.16);
    --panel-hi:rgba(255,255,255,.85);
    --panel-hover:rgba(255,255,255,.85);
    --ring:rgba(47,69,87,.28);
    --hair:rgba(41,63,79,.22);
    --shadow:0 18px 40px -28px rgba(16,30,40,.75);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground-1:#11171c;
      --ground-2:#18232b;
      --ground-3:#0d1216;
      --vein-rgb:186,206,217;
      --cloud-rgb:104,132,150;
      --vein-a:.17;
      --cloud-a:.13;

      --navy:#cfdde5;
      --navy-soft:#9db2bf;
      --ink:#e8edef;
      --muted:#8fa0aa;

      --logo-slab:rgba(214,232,240,.10);

      --panel:rgba(31,45,55,.55);
      --panel-line:rgba(174,199,212,.16);
      --panel-hi:rgba(196,219,231,.07);
      --panel-hover:rgba(38,55,67,.72);
      --ring:rgba(174,199,212,.26);
      --hair:rgba(174,199,212,.2);
      --shadow:0 18px 44px -26px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --ground-1:#11171c;
    --ground-2:#18232b;
    --ground-3:#0d1216;
    --vein-rgb:186,206,217;
    --cloud-rgb:104,132,150;
    --vein-a:.17;
    --cloud-a:.13;

    --navy:#cfdde5;
    --navy-soft:#9db2bf;
    --ink:#e8edef;
    --muted:#8fa0aa;

    --logo-slab:rgba(214,232,240,.10);

    --panel:rgba(31,45,55,.55);
    --panel-line:rgba(174,199,212,.16);
    --panel-hi:rgba(196,219,231,.07);
    --panel-hover:rgba(38,55,67,.72);
    --ring:rgba(174,199,212,.26);
    --hair:rgba(174,199,212,.2);
    --shadow:0 18px 44px -26px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--ground-1);
    color:var(--ink);
    font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .slab{
    position:relative;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:44px 24px calc(36px + env(safe-area-inset-bottom));
    overflow:hidden;
    background:
      radial-gradient(120% 80% at 22% 8%, var(--ground-1) 0%, transparent 60%),
      linear-gradient(158deg, var(--ground-1) 0%, var(--ground-2) 58%, var(--ground-3) 100%);
  }
  #marble{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:392px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .logo{
    width:min(72%, 262px);
    height:auto;
    color:var(--navy);
    display:block;
  }

  .names{
    margin:22px 0 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
  }
  .name-ar{
    margin:0;
    font-family:"Tajawal","Segoe UI",sans-serif;
    font-weight:500;
    font-size:19px;
    line-height:1.5;
    color:var(--navy);
  }
  .name-en{
    margin:0;
    font-size:10.5px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .panel{
    width:100%;
    margin-top:30px;
    border-radius:16px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    box-shadow:inset 0 1px 0 var(--panel-hi), var(--shadow);
    overflow:hidden;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }

  .row{
    display:grid;
    grid-template-columns:38px 1fr 10px;
    align-items:center;
    gap:15px;
    padding:14px 17px;
    min-height:70px;
    text-decoration:none;
    color:inherit;
    transition:background-color .16s ease;
  }
  .row + .row{ border-top:1px solid var(--panel-line); }
  .row:hover{ background-color:var(--panel-hover); }
  .row:focus-visible{ outline:2px solid var(--navy); outline-offset:-3px; }

  .medallion{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--ring);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--navy);
  }
  .medallion svg{ width:17px; height:17px; }

  .field{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .field .label{
    font-size:9.5px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .field .value{
    font-size:16px;
    font-weight:500;
    color:var(--navy);
    direction:ltr;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chev{ color:var(--muted); opacity:.6; }
  .chev svg{ width:10px; height:10px; display:block; }

  .elsewhere{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0;
    margin-top:18px;
    width:100%;
  }
  .elsewhere a{
    flex:1 1 0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 8px;
    color:var(--navy-soft);
    text-decoration:none;
    font-size:12.5px;
    letter-spacing:.04em;
  }
  .elsewhere a + a{ border-left:1px solid var(--hair); }
  .elsewhere a svg{ width:14px; height:14px; }
  .elsewhere a:hover{ color:var(--navy); }
  .elsewhere a:focus-visible{ outline:2px solid var(--navy); outline-offset:2px; border-radius:6px; }

  .tagline{
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    margin-top:32px;
  }
  .tagline i{ flex:1 1 auto; height:1px; background:var(--hair); }
  .tagline span{
    font-family:"Marcellus",Georgia,serif;
    font-size:12.5px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
  }

  @media (max-height:680px){
    .slab{ align-items:flex-start; }
  }
  @media (prefers-reduced-motion: reduce){
    .row{ transition:none; }
  }
</style>

<script>
(function(){
  var cv = document.getElementById('marble');
  if(!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');

  function hash(x, y){
    var n = Math.imul(x|0, 374761393) ^ Math.imul(y|0, 668265263);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
  }
  function vn(x, y){
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
    var a = hash(xi,yi), b = hash(xi+1,yi), c = hash(xi,yi+1), d = hash(xi+1,yi+1);
    return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
  }
  function fbm(x, y){
    var s = 0, amp = 0.5, f = 1;
    for(var i=0;i<5;i++){ s += amp*vn(x*f, y*f); f *= 2; amp *= 0.5; }
    return s;
  }
  function rgb(name, fallback){
    var raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    var parts = (raw || fallback).split(',');
    return [parseFloat(parts[0]), parseFloat(parts[1]), parseFloat(parts[2])];
  }
  function num(name, fallback){
    var raw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
    return isNaN(raw) ? fallback : raw;
  }

  function render(){
    var r = cv.getBoundingClientRect();
    var W = Math.max(2, Math.round(r.width / 3));
    var H = Math.max(2, Math.round(r.height / 3));
    cv.width = W; cv.height = H;

    var vein = rgb('--vein-rgb', '118,130,140');
    var cloud = rgb('--cloud-rgb', '142,152,159');
    var veinA = num('--vein-a', 0.34);
    var cloudA = num('--cloud-a', 0.17);

    var img = ctx.createImageData(W, H);
    var d = img.data;
    var scale = 3.1 / W;

    for(var y=0; y<H; y++){
      for(var x=0; x<W; x++){
        var u = x * scale, v = y * scale;
        var q = fbm(u, v);
        var w = fbm(u*1.1 + 3.6*q + 1.7, v*1.1 + 3.6*q + 9.2);
        var s = Math.sin((u*1.15 + v*0.42 + w*3.2) * Math.PI * 1.2);
        s = Math.pow(1 - Math.abs(s), 13);
        var cl = Math.pow(w, 1.7);

        var a1 = cl * cloudA;
        var a2 = s * veinA;
        var a = a1 + a2*(1-a1);
        var i = (y*W + x) * 4;
        if(a > 0.0005){
          d[i]   = (cloud[0]*a1 + vein[0]*a2*(1-a1)) / a;
          d[i+1] = (cloud[1]*a1 + vein[1]*a2*(1-a1)) / a;
          d[i+2] = (cloud[2]*a1 + vein[2]*a2*(1-a1)) / a;
          d[i+3] = a * 255;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  render();

  var t;
  window.addEventListener('resize', function(){
    clearTimeout(t);
    t = setTimeout(render, 250);
  });
  if(window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if(mq.addEventListener){ mq.addEventListener('change', render); }
    else if(mq.addListener){ mq.addListener(render); }
  }
})();
</script>
</body>
</html>
