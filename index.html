<title>Manajim Libya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Tajawal:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
  :root{
    --bg-top:#eef1f2;
    --bg-bottom:#c2ccd1;
    --navy:#344b5b;
    --navy-deep:#24333f;
    --pill-label:#4a6070;
    --pill-value-bg:#344b5b;
    --pill-text:#f3f5f5;
    --ink:#1c2731;
    --muted:#5b6b76;
    --divider:rgba(52,75,91,.22);
    --vein:#344b5b;
    --vein-opacity:.05;
    --link:#344b5b;
    --focus:#24333f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-top:#12181d;
      --bg-bottom:#202e38;
      --navy:#9db1bd;
      --navy-deep:#c7d4da;
      --pill-label:#324450;
      --pill-value-bg:#24333f;
      --pill-text:#eef1f2;
      --ink:#eef1f2;
      --muted:#8fa2ac;
      --divider:rgba(157,177,189,.22);
      --vein:#9db1bd;
      --vein-opacity:.07;
      --link:#a9bcc7;
      --focus:#eef1f2;
    }
  }
  :root[data-theme="dark"]{
    --bg-top:#12181d;
    --bg-bottom:#202e38;
    --navy:#9db1bd;
    --navy-deep:#c7d4da;
    --pill-label:#324450;
    --pill-value-bg:#24333f;
    --pill-text:#eef1f2;
    --ink:#eef1f2;
    --muted:#8fa2ac;
    --divider:rgba(157,177,189,.22);
    --vein:#9db1bd;
    --vein-opacity:.07;
    --link:#a9bcc7;
    --focus:#eef1f2;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-top);
    color:var(--ink);
    font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .scene{
    position:relative;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px 32px;
    overflow:hidden;
    background:linear-gradient(155deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  }
  .veins{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    opacity:var(--vein-opacity);
  }
  .veins path{
    fill:none;
    stroke:var(--vein);
    stroke-width:1.1;
    stroke-linecap:round;
  }
  .veins .slab{
    fill:var(--vein);
    stroke:none;
  }

  main.card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .logo{
    width:min(78%, 300px);
    height:auto;
    display:block;
    filter:drop-shadow(0 10px 24px rgba(24,35,44,.12));
  }

  .kicker{
    margin:18px 0 0;
    font-size:12.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:500;
  }

  .divider{
    width:56px;
    height:1px;
    background:var(--divider);
    margin:22px 0 26px;
  }

  nav.actions{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  a.action{
    display:flex;
    align-items:stretch;
    gap:8px;
    text-decoration:none;
    color:inherit;
    transition:transform .15s ease, filter .15s ease;
  }
  a.action:hover{ filter:brightness(1.08); }
  a.action:active{ transform:scale(.985); }
  a.action:focus-visible{ outline:2px solid var(--focus); outline-offset:3px; border-radius:24px; }

  .action-label{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    padding:0 18px;
    border-radius:999px;
    background:var(--pill-label);
    color:var(--pill-text);
    font-size:12px;
    font-weight:500;
    letter-spacing:.02em;
    white-space:nowrap;
  }

  .action-value{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 18px;
    border-radius:999px;
    background:var(--pill-value-bg);
    color:var(--pill-text);
    font-size:15px;
    font-weight:500;
    direction:ltr;
    overflow:hidden;
  }
  .action-value svg{ flex:0 0 auto; width:17px; height:17px; opacity:.85; }
  .action-value span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .links{
    width:100%;
    display:flex;
    justify-content:center;
    gap:22px;
    margin-top:22px;
  }
  .links a{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--link);
    text-decoration:none;
    font-size:13px;
    font-weight:500;
    padding:6px 2px;
  }
  .links a svg{ width:15px; height:15px; }
  .links a:hover{ text-decoration:underline; text-underline-offset:3px; }
  .links a:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }

  footer{
    margin-top:30px;
  }
  .tagline{
    margin:0;
    font-family:"Cormorant Garamond", Georgia, serif;
    font-style:italic;
    font-size:16px;
    letter-spacing:.14em;
    color:var(--muted);
  }

  .ar{
    font-family:"Tajawal", "Segoe UI", sans-serif;
  }

  @media (prefers-reduced-motion: reduce){
    a.action{ transition:none; }
  }
</style>
